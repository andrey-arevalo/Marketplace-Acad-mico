<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      
      <!-- Botón Volver elegante fuera/arriba de la tarjeta -->
      <div class="mb-3">
        <button type="button" class="btn btn-volver-custom d-flex align-items-center gap-2" (click)="cancelar()">
          <span>←</span> Volver
        </button>
      </div>

      <div class="card border-0 shadow-sm rounded-4 create-product-card">
        <div class="card-body p-4 p-lg-5">
          
          <div class="mb-4">
            <h1 class="fw-bold title-main">
              Registrar producto
            </h1>
            <p class="text-muted subtitle-main">
              Completa los datos de lo que deseas vender o intercambiar con la comunidad UTP.
            </p>
          </div>

          <form
            #productForm="ngForm"
            (ngSubmit)="crearProducto()">

            <!-- 1. NOMBRE DEL PRODUCTO -->
            <div class="mb-3">
              <label class="form-label fw-semibold">
                Nombre del producto *
              </label>
              <input
                type="text"
                class="form-control custom-input"
                name="nom_prod"
                [(ngModel)]="producto.nom_prod"
                required
                minlength="3"
                maxlength="150"
                placeholder="Ej: Libro de Cálculo III">
            </div>

            <!-- 2. TIPO Y CANTIDAD -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">
                  Tipo de producto (Categoría) *
                </label>
                <select
                  class="form-select custom-input"
                  name="cat_prodid"
                  [(ngModel)]="producto.cat_prodid"
                  required>
                  <option [ngValue]="0" disabled>
                    Selecciona una categoría
                  </option>
                  <option
                    *ngFor="let categoria of categorias"
                    [ngValue]="categoria.id">
                    {{ categoria.nombre }}
                  </option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">
                  Cantidad (Stock) *
                </label>
                <input
                  type="number"
                  class="form-control custom-input"
                  name="stock"
                  [(ngModel)]="producto.stock"
                  required
                  min="1"
                  step="1"
                  placeholder="Ej: 10">
              </div>
            </div>

            <!-- 3. PRECIO Y ESTADO -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">
                  Precio (S/.) *
                </label>
                <input
                  type="number"
                  class="form-control custom-input"
                  name="precio"
                  [(ngModel)]="producto.precio"
                  required
                  min="0.00"
                  step="0.01"
                  placeholder="Ej: 45.00">
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">
                  Estado *
                </label>
                <select
                  class="form-select custom-input"
                  name="estado"
                  [(ngModel)]="producto.estado"
                  required>
                  <option value="" disabled>
                    Selecciona un estado
                  </option>
                  <option value="Disponible">
                    Disponible
                  </option>
                  <option value="Intercambio">
                    Intercambio
                  </option>
                </select>
              </div>
            </div>

            <!-- 4. FOTOGRAFÍA DEL PRODUCTO -->
            <div class="mb-4">
              <label class="form-label fw-semibold">
                Fotografía del producto *
              </label>
              <input
                type="file"
                class="form-control custom-input"
                id="img_prod"
                (change)="onFileSelected($event)"
                accept="image/*"
                required>
              <div class="form-text text-muted small mt-1">Sube una imagen clara en formato JPG o PNG.</div>
            </div>

            <!-- Alerta de error -->
            <div
              *ngIf="errorMessage"
              class="alert alert-danger rounded-3 py-2 small mb-4">
              {{ errorMessage }}
            </div>

            <!-- Botones de Acción (Diseño equilibrado y elegante) -->
            <div class="d-flex gap-3 pt-2">
              <button
                type="button"
                class="btn btn-outline-cancel flex-fill py-2.5 fw-semibold"
                (click)="cancelar()">
                Cancelar
              </button>

              <button
                type="submit"
                class="btn btn-publicar flex-fill py-2.5 fw-bold"
                [disabled]="productForm.invalid || loading">
                <span *ngIf="!loading">
                  Publicar producto
                </span>
                <span *ngIf="loading">
                  Guardando...
                </span>
              </button>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</section>
