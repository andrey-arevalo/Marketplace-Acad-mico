<div class="container mt-4">
  <div class="card p-4 shadow-sm">
    <div class="row align-items-center">
      <div class="col-md-3 text-center">
        <img [src]="usuario.avatar || 'Avatar-perfil-prueba.jpeg'" alt="Avatar" class="rounded-circle img-fluid" style="width: 120px; height: 120px; object-fit: cover;">
      </div>
      <div class="col-md-9">
        <h2>{{ usuario.nombre }}</h2>
        <p class="text-muted">{{ usuario.carrera }} - Ciclo {{ usuario.ciclo }}</p>
        <div class="d-flex gap-3">
          <span><strong>{{ usuario.articulosActivos }}</strong> Artículos activos</span>
          <span><strong>{{ usuario.reputacion }} ★</strong> Reputación</span>
        </div>
      </div>
    </div>
  </div>
</div>
